apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviator-dashboard
  namespace: aviator-core
  labels:
    app: aviator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aviator
  template:
    metadata:
      labels:
        app: aviator
        # REMOVED: azure.workload.identity/use: "true"
    spec:
      serviceAccountName: aviator-service-account
      containers:
      - name: aviator-container
        image: aviatoracrjetops01.azurecr.io/aviatorcoreapp:latest # Use the latest pushed image
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: JETOPS_SQL_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: aviator-sql-connection
              key: JETOPS_SQL_CONNECTION_STRING
---
apiVersion: v1
kind: Service
metadata:
  name: aviator-service
  namespace: aviator-core
spec:
  type: LoadBalancer
  selector:
    app: aviator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aviator-service-account
  namespace: aviator-core