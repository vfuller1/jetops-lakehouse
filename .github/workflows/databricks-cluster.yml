name: 'Herbalife Databricks Cluster'

on:
  workflow_dispatch:

jobs:
  terraform:
    name: 'Databricks Cluster'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Validate Databricks Host
      shell: bash
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      run: |
        python - <<'PY'
        import os
        import socket
        import sys
        from urllib.parse import urlparse

        raw_host = os.environ.get("DATABRICKS_HOST", "").strip()
        if not raw_host:
            sys.exit("DATABRICKS_HOST is empty")

        parsed = urlparse(raw_host if "://" in raw_host else f"https://{raw_host}")
        hostname = parsed.hostname
        if not hostname:
            sys.exit("DATABRICKS_HOST must be a full Databricks workspace URL, for example https://adb-1234567890123456.7.azuredatabricks.net")

        try:
            socket.gethostbyname(hostname)
        except OSError as exc:
            sys.exit(f"DATABRICKS_HOST is not resolvable: {hostname} ({exc})")

        print(f"Validated DATABRICKS_HOST hostname: {hostname}")
        PY

    - name: Validate Databricks Token
      shell: bash
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.TERRAFORM_ACCESS }}
      run: |
        curl --fail --silent --show-error \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          "$DATABRICKS_HOST/api/2.0/clusters/list-node-types" > /dev/null

    - name: Terraform Init
      working-directory: databricks_cluster
      run: terraform init -reconfigure
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.TERRAFORM_ACCESS }}
        TF_VAR_herbalife_bronze_sas_token: ${{ secrets.HERBALIFE_BRONZE_SAS_TOKEN }}

    - name: Terraform Plan
      working-directory: databricks_cluster
      run: terraform plan
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.TERRAFORM_ACCESS }}
        TF_VAR_herbalife_bronze_sas_token: ${{ secrets.HERBALIFE_BRONZE_SAS_TOKEN }}

    - name: Terraform Apply
      working-directory: databricks_cluster
      run: terraform apply -auto-approve
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.TERRAFORM_ACCESS }}
        TF_VAR_herbalife_bronze_sas_token: ${{ secrets.HERBALIFE_BRONZE_SAS_TOKEN }}